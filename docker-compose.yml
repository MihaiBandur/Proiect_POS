# Masinile din laborator (student-kit/lab-node): Debian cu sshd, pe care executorul SSH copiaza
# si ruleaza scripturile. Setarile comune sunt definite o data si refolosite cu <<: *lab-node.
x-lab-node: &lab-node
  build: ./student-kit/lab-node
  depends_on:
    lab-ssh-key-init:
      condition: service_completed_successfully
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 128

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: users
      MARIADB_USER: python_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
       - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/mariadb-init:/docker-entrypoint-initdb.d:ro
    # "Sanatos" = accepta conexiuni si InnoDB e pornit (scriptul healthcheck.sh e in imagine).
    # Serviciul de auth porneste abia dupa aceea (depends_on).
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [auth-db]
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0.34
    environment:
        MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
        MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
        MONGO_USER_ADMIN_USERNAME: ${MONGO_USER_ADMIN_USERNAME}
        MONGO_USER_ADMIN_PASSWORD: ${MONGO_USER_ADMIN_PASSWORD}
        MONGO_DB_NAME: ${MONGO_DB_NAME}
        MONGO_DB_OWNER_USERNAME: ${MONGO_DB_OWNER_USERNAME}
        MONGO_DB_OWNER_PASSWORD: ${MONGO_DB_OWNER_PASSWORD}
        MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
        MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./db/mongodb-init:/docker-entrypoint-initdb.d
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks: [jobs-db]
  mongodb-test:
    image: mongodb/mongodb-atlas-local:8.0.34
    profiles: ["test"]
    environment:
        MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
        MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
        MONGO_USER_ADMIN_USERNAME: ${MONGO_USER_ADMIN_USERNAME}
        MONGO_USER_ADMIN_PASSWORD: ${MONGO_USER_ADMIN_PASSWORD}
        MONGO_DB_NAME: ${MONGO_DB_NAME}
        MONGO_DB_OWNER_USERNAME: ${MONGO_DB_OWNER_USERNAME}
        MONGO_DB_OWNER_PASSWORD: ${MONGO_DB_OWNER_PASSWORD}
        MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
        MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ./db/mongodb-init:/docker-entrypoint-initdb.d
    # mode=1777: imaginea ruleaza MongoDB ca utilizator obisnuit (nu root), iar tmpfs se creeaza
    # implicit doar cu drept de scriere pentru root.
    tmpfs:
      - /data/db:mode=1777
      - /data/configdb:mode=1777

  # A&A Services (gRPC). Ruleaza fie aici, fie local cu "python auth_service.py",
  # nu amandoua deodata: folosesc acelasi port.
  auth:
    build: ./auth_service
    environment:
      AUTH_ADDR: 0.0.0.0:50051 # in container ascultam pe toate interfetele, nu doar pe 127.0.0.1
      DB_HOST: mariadb         # numele serviciului e si numele lui in reteaua Docker
      DB_PORT: "3306"
      DB_USER: python_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:50051:50051" # pentru cererile gRPC din Bruno, de pe calculatorul tau
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks: [auth-db, services]

  # RESTful Job Management Service (Go) + executorul SSH din student-kit, in acelasi container
  # (asa cere kit-ul). Ruleaza fie aici, fie local cu "go run ." (atunci fara executor: mock).
  job-management:
    build:
      context: .   # radacina: imaginea are nevoie si de student-kit/rest-service/ssh-executor
      dockerfile: database_layer_service/Dockerfile
    environment:
      STORAGE: mongo
      MONGO_ADDR: mongodb:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      AUTH_GRPC_ADDR: auth:50051
      SCRIPTS_DIR: /var/lib/lab-manager/scripts
      # SP 1.3: canalul catre executor si link-ul catre Job Status Service; daca lipseste
      # oricare, task-urile sunt mock. JOB_STATUS_URL e adresa viitorului Job Status Service.
      IPC_SOCKET_PATH: /run/lab-manager/ipc/executor.sock
      JOB_STATUS_URL: ${JOB_STATUS_URL:-http://job-status:8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Pentru executorul din kit: baza noastra si colectia de task-uri (implicit ar fi "jobs").
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=${MONGO_DB_NAME}&directConnection=true
      JOBS_COLLECTION: tasks
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - scripts:/var/lib/lab-manager/scripts              # fisierele incarcate (upload)
      - executor-ssh-key:/run/lab-manager/ssh:ro          # cheia cu care executorul intra pe masini
      - lab-host-keys:/var/lib/lab-manager/host-keys:ro   # cheile masinilor (known_hosts)
    depends_on:
      mongodb:
        condition: service_healthy
      auth:
        condition: service_started
      lab-node-1:
        condition: service_healthy
      lab-node-2:
        condition: service_healthy
      lab-node-3:
        condition: service_healthy
    restart: unless-stopped
    networks: [jobs-db, services, lab-net]

  # Genereaza o singura data perechea de chei SSH a executorului (student-kit).
  lab-ssh-key-init:
    build: ./student-kit/lab-node
    entrypoint: ["/init-executor-key.sh"]
    volumes:
      - executor-ssh-key:/executor-key
    network_mode: none
    restart: "no"

  lab-node-1:
    <<: *lab-node
    hostname: node-1
    environment:
      LAB_NODE_ID: node-1
    volumes:
      - executor-ssh-key:/executor-key:ro
      - lab-host-keys:/host-keys
    networks:
      lab-net:
        ipv4_address: 10.89.0.11

  lab-node-2:
    <<: *lab-node
    hostname: node-2
    environment:
      LAB_NODE_ID: node-2
    volumes:
      - executor-ssh-key:/executor-key:ro
      - lab-host-keys:/host-keys
    networks:
      lab-net:
        ipv4_address: 10.89.0.12

  lab-node-3:
    <<: *lab-node
    hostname: node-3
    environment:
      LAB_NODE_ID: node-3
    volumes:
      - executor-ssh-key:/executor-key:ro
      - lab-host-keys:/host-keys
    networks:
      lab-net:
        ipv4_address: 10.89.0.13

volumes:
  mariadb_data:
  mongodb_data:
  mongodb_config:
  # Fisierele scripturilor, de unde executorul le copiaza pe masini (SP 1.3).
  scripts:
  # Cheia SSH a executorului si cheile publice ale masinilor (student-kit).
  executor-ssh-key:
  lab-host-keys:

# Fiecare serviciu vede doar ce ii trebuie: bazele de date sunt accesibile doar serviciului
# care le foloseste, iar serviciile vorbesc intre ele prin reteaua "services".
networks:
  auth-db:   # MariaDB <-> A&A Services
  jobs-db:   # MongoDB <-> Job Management Service
  services:  # A&A Services <-> Job Management Service (gRPC)
  # Reteaua laboratorului: doar masinile si containerul executorului. internal: fara iesire
  # spre exterior. IP-urile fixe sunt cele pe care le inregistrezi la POST /computers.
  lab-net:
    internal: true
    ipam:
      config:
        - subnet: 10.89.0.0/24
